apiVersion: v1
kind: Secret
metadata:
  name: firstlight-secrets
type: Opaque
stringData:
  DATABASE_URL: replace-at-deploy-time
  VALKEY_URL: replace-at-deploy-time
  AKAMAI_INFERENCE_API_KEY: replace-at-deploy-time
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firstlight-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: firstlight-api }
  template:
    metadata:
      labels: { app: firstlight-api }
    spec:
      containers:
        - name: api
          image: ghcr.io/replace-me/firstlight:latest
          ports: [{ containerPort: 8000 }]
          envFrom: [{ secretRef: { name: firstlight-secrets } }]
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 8
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1000m, memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: firstlight-api
spec:
  selector: { app: firstlight-api }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firstlight-worker
spec:
  replicas: 1
  selector:
    matchLabels: { app: firstlight-worker }
  template:
    metadata:
      labels: { app: firstlight-worker }
    spec:
      containers:
        - name: worker
          image: ghcr.io/replace-me/firstlight:latest
          command: ["python", "-m", "backend.app.worker"]
          envFrom: [{ secretRef: { name: firstlight-secrets } }]
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 512Mi }
